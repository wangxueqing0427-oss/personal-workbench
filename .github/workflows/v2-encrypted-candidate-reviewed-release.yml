name: Deploy isolated encrypted V2 candidate from frozen reviewed artifacts
on:
  push:
    branches:
      - review/v2-pinned-candidate-release-20261116
    paths:
      - v2/encrypted-candidate-preview.trigger
permissions:
  contents: read
  actions: read
concurrency:
  group: personal-workbench-v2-encrypted-candidate
  cancel-in-progress: false
jobs:
  deploy:
    # These dedicated flags require account-owner review of the token policy and
    # free plan. Target access/zero bindings alone DO NOT prove token scope.
    if: >-
      github.ref == 'refs/heads/review/v2-pinned-candidate-release-20261116' &&
      vars.V2_ENCRYPTED_CANDIDATE_SCOPE_CONFIRMED == 'true' &&
      vars.V2_ENCRYPTED_CANDIDATE_FREE_PLAN_CONFIRMED == 'true' &&
      vars.V2_PREVIEW_DEPLOY_ENABLED == 'true' &&
      vars.V2_PREVIEW_FREE_PLAN_CONFIRMED == 'true' &&
      vars.V2_PREVIEW_WORKER_READY == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_ENCRYPTED_CANDIDATE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: "false"
      CANDIDATE_BASE_URL: https://personal-workbench-v2-encrypted-candidate.wangxueqing0427.workers.dev/
      CANDIDATE_EXPECTED_SHA: 50632b1d5da41f48719c1c9ec195d47d8be1ce9f
    steps:
      - name: Checkout the isolated development branch only
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Enforce static-only target, free-plan gate, and no overwrite
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "wangxueqing0427-oss/personal-workbench"
          test "$GITHUB_REF" = "refs/heads/review/v2-pinned-candidate-release-20261116"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          node <<'NODE'
          const fs=require('node:fs');
          const c=JSON.parse(fs.readFileSync('v2/wrangler.encrypted-preview.jsonc','utf8'));
          const only=(o,keys)=>o&&Object.keys(o).every(k=>keys.includes(k));
          if(!only(c,['name','compatibility_date','workers_dev','assets','observability'])||
             !only(c.assets,['directory','html_handling','not_found_handling'])||
             !only(c.observability,['enabled'])||c.observability.enabled!==false||
             c.name!=='personal-workbench-v2-encrypted-candidate'||
             c.main!==undefined||c.workers_dev!==true||
             c.assets?.directory!=='./candidate-public'||
             c.assets?.html_handling!=='none'||
             c.assets?.not_found_handling!=='404-page'||
             c.assets?.binding!==undefined||c.assets?.run_worker_first!==undefined||
             c.durable_objects!==undefined||c.kv_namespaces!==undefined||
             c.r2_buckets!==undefined||c.d1_databases!==undefined||
             c.vars!==undefined||c.routes!==undefined||c.route!==undefined||
             c.triggers!==undefined) throw Error('Candidate must be a static-assets-only Worker with no data bindings, routes or runtime script');
          console.log('ENCRYPTED_STATIC_ONLY_CONFIG_PASS');
          NODE
          node <<'NODE'
          const base='https://api.cloudflare.com/client/v4/accounts/'+process.env.CLOUDFLARE_ACCOUNT_ID+
            '/workers/scripts/personal-workbench-v2-encrypted-candidate';
          const headers={Authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN};
          async function get(path){
            const response=await fetch(base+path,{headers});
            const body=await response.json().catch(()=>({}));
            if(!response.ok){
              const errors=(body.errors||[]).map(e=>({code:e.code,message:e.message}));
              console.error(JSON.stringify({path,httpStatus:response.status,errors}));
              throw Error('Dedicated Worker missing or token lacks access to this Worker; refusing deployment');
            }
            if(body.success===false)throw Error('Cloudflare rejected dedicated Worker preflight');
            return body.result||{};
          }
          (async()=>{
            const settings=await get('/settings');
            if(!Object.prototype.hasOwnProperty.call(settings,'bindings')||
               !Array.isArray(settings.bindings)||settings.bindings.length!==0)
              throw Error('Dedicated Worker bindings must be explicitly reported as an empty array; refuse ambiguous or bound targets');
            const subdomain=await get('/subdomain');
            if(subdomain.enabled!==true)
              throw Error('Enable workers.dev for the dedicated candidate Worker before deployment');
            console.log('ENCRYPTED_TARGET_EXISTING_EMPTY_WORKER_PASS');
          })().catch(e=>{console.error(e.message);process.exitCode=1;});
          NODE
      - name: Refuse to overwrite a changed or already-deployed target
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          (async()=>{
            const url='https://personal-workbench-v2-encrypted-candidate.wangxueqing0427.workers.dev/';
            const response=await fetch(url,{redirect:'error',cache:'no-store',signal:AbortSignal.timeout(12000)});
            if(response.status!==200)
              throw Error('Dedicated target no longer returns the expected placeholder status; STOP');
            const current=await response.text();
            if(current.trim()!=='Hello World!')
              throw Error('Dedicated target is no longer the original Hello World placeholder; refuse to overwrite it');
            console.log('ISOLATED_TARGET_STILL_EMPTY_PLACEHOLDER_PASS');
          })().catch(e=>{console.error(e.message);process.exitCode=1;});
          NODE

      - name: Refuse release if audited application inputs changed
        shell: bash
        run: |
          set -euo pipefail
          PINNED_SHA=50632b1d5da41f48719c1c9ec195d47d8be1ce9f
          # Fetch just the audited commit, not all repository branches and history.
          git fetch --no-tags --depth=1 origin "$PINNED_SHA"
          git cat-file -e "$PINNED_SHA^{commit}"
          git diff --name-only "$PINNED_SHA" "$GITHUB_SHA" |
            while IFS= read -r changed; do
              case "$changed" in
                CURRENT.md|v2/IPHONE-CANDIDATE-ACCEPTANCE-2026-11-16.md|.github/workflows/v2-encrypted-candidate-reviewed-release.yml|v2/verify-encrypted-candidate-artifacts.cjs|v2/encrypted-candidate-preview.trigger)
                  echo "Allowed non-application change: $changed" ;;
                *)
                  echo "STOP: application, test, config or unknown file changed: $changed" >&2
                  exit 1 ;;
              esac
            done
          test ! -e v2/candidate-public
          test ! -e /tmp/v2-encrypted-candidate-webkit
          echo 'AUDITED_APPLICATION_SOURCES_UNCHANGED'

      - name: Confirm the exact completed upstream CI run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node <<'NODE'
          (async()=>{
            const url='https://api.github.com/repos/wangxueqing0427-oss/personal-workbench/actions/runs/43779408305';
            const res=await fetch(url,{headers:{
              Authorization:'Bearer '+process.env.GH_TOKEN,
              Accept:'application/vnd.github+json',
              'X-GitHub-Api-Version':'2022-11-28'
            }});
            if(!res.ok)throw Error('Cannot verify audited upstream GitHub Actions run');
            const run=await res.json();
            if(run.id!==43779408305||run.status!=='completed'||
              run.conclusion!=='success'||run.event!=='push'||
              run.head_branch!=='dev/v2-preview-isolated-20261111'||
              run.head_sha!=='50632b1d5da41f48719c1c9ec195d47d8be1ce9f'||
              run.path!=='.github/workflows/v2-encrypted-candidate.yml')
              throw Error('Wrong CI source/status/branch/commit/workflow: deployment refused');
            console.log('FROZEN_CI_SUCCESS_COMMIT_AND_WORKFLOW_CONFIRMED');
          })().catch(e=>{console.error(e.message);process.exitCode=1;});
          NODE

      - name: Download previously tested Chromium build (no local retest)
        uses: actions/download-artifact@v4
        with:
          name: v2-encrypted-candidate-chromium-50632b1d5da41f48719c1c9ec195d47d8be1ce9f
          repository: wangxueqing0427-oss/personal-workbench
          run-id: 43779408305
          github-token: ${{ github.token }}
          path: v2/candidate-public

      - name: Download independently tested WebKit build (no local retest)
        uses: actions/download-artifact@v4
        with:
          name: v2-encrypted-candidate-webkit-50632b1d5da41f48719c1c9ec195d47d8be1ce9f
          repository: wangxueqing0427-oss/personal-workbench
          run-id: 43779408305
          github-token: ${{ github.token }}
          path: /tmp/v2-encrypted-candidate-webkit

      - name: Verify 14 immutable assets from both engines; reject any difference
        shell: bash
        run: |
          set -euo pipefail
          node --check v2/verify-encrypted-candidate-artifacts.cjs
          node v2/verify-encrypted-candidate-artifacts.cjs \
            v2/candidate-public /tmp/v2-encrypted-candidate-webkit
          node --check v2/test-encrypted-candidate-remote.cjs

      - name: Prepare only the remote post-deploy HTTPS browser checks
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix /tmp/workbench-v2-encrypted-candidate-preview --no-save --no-package-lock playwright@1.56.1
          /tmp/workbench-v2-encrypted-candidate-preview/node_modules/.bin/playwright install --with-deps chromium webkit

      - name: Deploy only the new static-assets-only test Worker
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.149.0 deploy --config v2/wrangler.encrypted-preview.jsonc
      - name: Verify live HTTPS assets, mobile camera/voice fallback and offline boot
        shell: bash
        env:
          NODE_PATH: /tmp/workbench-v2-encrypted-candidate-preview/node_modules
        run: |
          set -euo pipefail
          WB_BROWSER=chromium node v2/test-encrypted-candidate-remote.cjs
          WB_BROWSER=webkit node v2/test-encrypted-candidate-remote.cjs
          echo ENCRYPTED_CANDIDATE_LIVE_HTTPS_ACCEPTANCE_PASS
