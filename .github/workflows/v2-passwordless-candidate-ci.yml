name: Passwordless V2 isolated iPhone candidate - build and test only
on:
  push:
    branches:
      - feat/v2-passwordless-iphone-20261117
    paths:
      - .github/workflows/v2-passwordless-candidate-ci.yml
      - v2/candidate-passwordless-boot.js
      - v2/build-encrypted-candidate.cjs
      - v2/test-passwordless-candidate.cjs
      - v2/privacy-delta-journal-poc.js
      - v2/business-core.js
      - v2/business-ui.js
      - v2/business.css
  workflow_dispatch:
permissions:
  contents: read
jobs:
  passwordless:
    if: github.ref == 'refs/heads/feat/v2-passwordless-iphone-20261117'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    env:
      NODE_PATH: /tmp/workbench-v2-passwordless/node_modules
      WB_BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v4
      - name: Build only, no Cloudflare or production
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "wangxueqing0427-oss/personal-workbench"
          test "$GITHUB_REF" = "refs/heads/feat/v2-passwordless-iphone-20261117"
          node --check v2/build-encrypted-candidate.cjs
          node --check v2/candidate-passwordless-boot.js
          node --check v2/test-passwordless-candidate.cjs
          node v2/build-encrypted-candidate.cjs | tee /tmp/build.log
          grep -F 'ENCRYPTED_CANDIDATE_BUILD_PASS' /tmp/build.log
          grep -F '"productionDeployAllowed":false' /tmp/build.log
          grep -F '"productionReady":false' /tmp/build.log
          grep -F 'data-passwordless-create' v2/candidate-public/encrypted-boot.js
          ! grep -q '设置独立恢复密码' v2/candidate-public/encrypted-boot.js
          node v2/test-encrypted-candidate-sw.cjs
      - name: Install isolated browser
        run: |
          set -euo pipefail
          npm install --prefix /tmp/workbench-v2-passwordless --no-save --no-package-lock playwright@1.56.1
          /tmp/workbench-v2-passwordless/node_modules/.bin/playwright install --with-deps "$WB_BROWSER"
      - name: Verify true passwordless workflow, encrypted data and portable recovery
        run: |
          set -euo pipefail
          node v2/test-passwordless-candidate.cjs | tee /tmp/passwordless.log
          grep -F 'PASSWORDLESS_CANDIDATE_BROWSER_PASS' /tmp/passwordless.log
      - name: Archive test candidate only
        uses: actions/upload-artifact@v4
        with:
          name: passwordless-v2-${{ matrix.browser }}-${{ github.sha }}
          path: v2/candidate-public/
          if-no-files-found: error
          retention-days: 7
