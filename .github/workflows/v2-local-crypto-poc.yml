name: V2 local ciphertext POC - isolated browser validation
on:
  push:
    branches:
      - dev/v2-preview-isolated-20261111
    paths:
      - .github/workflows/v2-local-crypto-poc.yml
      - v2/privacy-crypto-poc.js
      - v2/test-privacy-crypto-poc.cjs
      - v2/privacy-shadow-poc.js
      - v2/test-privacy-shadow-poc.cjs
      - v2/privacy-business-adapter-poc.js
      - v2/test-privacy-business-adapter-poc.cjs
      - v2/privacy-sharded-store-poc.js
      - v2/test-privacy-sharded-store-poc.cjs
      - v2/privacy-object-store-poc.js
      - v2/test-privacy-object-store-poc.cjs
      - v2/privacy-delta-journal-poc.js
      - v2/test-privacy-delta-journal-poc.cjs
      - v2/privacy-e2e-cloud-poc.js
      - v2/test-privacy-e2e-cloud-poc.cjs
      - v2/privacy-device-trust-poc.js
      - v2/test-privacy-device-trust-poc.cjs
      - v2/business-core.js
      - v2/business-ui.js
      - v2/business.css
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-local-encryption:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    env:
      NODE_PATH: /tmp/workbench-local-crypto-poc/node_modules
      WB_BROWSER: ${{ matrix.browser }}
    steps:
      - name: Checkout isolated V2 preview only
        uses: actions/checkout@v4
      - name: Validate repo identity and no live endpoint usage
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "wangxueqing0427-oss/personal-workbench"
          test "$GITHUB_REF" = "refs/heads/dev/v2-preview-isolated-20261111"
          node --check v2/privacy-crypto-poc.js
          node --check v2/test-privacy-crypto-poc.cjs
          node --check v2/privacy-shadow-poc.js
          node --check v2/test-privacy-shadow-poc.cjs
          node --check v2/privacy-business-adapter-poc.js
          node --check v2/test-privacy-business-adapter-poc.cjs
          node --check v2/privacy-sharded-store-poc.js
          node --check v2/test-privacy-sharded-store-poc.cjs
          node --check v2/privacy-object-store-poc.js
          node --check v2/test-privacy-object-store-poc.cjs
          node --check v2/privacy-delta-journal-poc.js
          node --check v2/test-privacy-delta-journal-poc.cjs
          node --check v2/privacy-e2e-cloud-poc.js
          node --check v2/test-privacy-e2e-cloud-poc.cjs
          node --check v2/privacy-device-trust-poc.js
          node --check v2/test-privacy-device-trust-poc.cjs
          ! grep -E 'personal-workbench-v2-(staging|preview)\.|CLOUDFLARE_API_TOKEN|wrangler deploy' v2/privacy-crypto-poc.js v2/test-privacy-crypto-poc.cjs v2/privacy-shadow-poc.js v2/test-privacy-shadow-poc.cjs v2/privacy-business-adapter-poc.js v2/test-privacy-business-adapter-poc.cjs v2/privacy-sharded-store-poc.js v2/test-privacy-sharded-store-poc.cjs v2/privacy-object-store-poc.js v2/test-privacy-object-store-poc.cjs v2/privacy-delta-journal-poc.js v2/test-privacy-delta-journal-poc.cjs v2/privacy-e2e-cloud-poc.js
          ! grep -E 'personal-workbench-v2-staging\\.|CLOUDFLARE_API_TOKEN|wrangler deploy' v2/test-privacy-e2e-cloud-poc.cjs
          test "$(grep -Fc "const remoteOrigin='https://personal-workbench-v2-preview.wangxueqing0427.workers.dev'" v2/test-privacy-e2e-cloud-poc.cjs)" -eq 1
          ! grep -E 'personal-workbench-v2-(staging|preview)\.|CLOUDFLARE_API_TOKEN|wrangler deploy|https://' v2/privacy-device-trust-poc.js v2/test-privacy-device-trust-poc.cjs
      - name: Install pinned isolated browser tools in temporary CI folder
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix /tmp/workbench-local-crypto-poc --no-save --no-package-lock playwright@1.56.1
          /tmp/workbench-local-crypto-poc/node_modules/.bin/playwright install --with-deps "$WB_BROWSER"
      - name: Verify AES-GCM synthetic record and 512KiB original offline end to end
        shell: bash
        run: |
          set -euo pipefail
          node v2/test-privacy-crypto-poc.cjs
          node v2/test-privacy-shadow-poc.cjs
          node v2/test-privacy-business-adapter-poc.cjs
          node v2/test-privacy-sharded-store-poc.cjs
          node v2/test-privacy-object-store-poc.cjs
          node v2/test-privacy-delta-journal-poc.cjs
          node v2/test-privacy-e2e-cloud-poc.cjs
          node v2/test-privacy-device-trust-poc.cjs
