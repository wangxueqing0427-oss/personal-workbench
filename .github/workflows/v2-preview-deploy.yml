name: Deploy isolated V2 preview
on:
  push:
    branches:
      - dev/v2-preview-isolated-20261111
    paths:
      - v2/preview-deploy.trigger
permissions:
  contents: read
concurrency:
  group: personal-workbench-v2-preview-deploy
  cancel-in-progress: false
jobs:
  deploy:
    if: >-
      github.ref == 'refs/heads/dev/v2-preview-isolated-20261111' &&
      vars.V2_PREVIEW_DEPLOY_ENABLED == 'true' &&
      vars.V2_PREVIEW_FREE_PLAN_CONFIRMED == 'true' &&
      vars.V2_PREVIEW_WORKER_READY == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PREVIEW_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - name: Checkout isolated preview branch
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Enforce exact target and free-plan approvals
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/dev/v2-preview-isolated-20261111"
          test "$GITHUB_REPOSITORY" = "wangxueqing0427-oss/personal-workbench"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          node -e "const fs=require('node:fs'); const c=JSON.parse(fs.readFileSync('./v2/wrangler.preview.jsonc','utf8')); if(c.name!=='personal-workbench-v2-preview'||c.vars.TEST_ENVIRONMENT!=='synthetic-only'||c.vars.TEST_DATASET!=='mobile-preview-20261111'||c.assets.directory!=='./preview-public'||c.durable_objects.bindings.length!==1||c.durable_objects.bindings[0].name!=='TEST_SYNC'||c.durable_objects.bindings[0].class_name!=='TestSync'||c.durable_objects.bindings[0].script_name) process.exit(1)"
      - name: Build immutable preview assets
        shell: bash
        run: |
          set -euo pipefail
          node v2/build-preview.cjs
          node <<'NODE'
          const fs=require('node:fs');
          const path=require('node:path');
          const crypto=require('node:crypto');
          const root='v2/preview-public';
          const m=JSON.parse(fs.readFileSync(path.join(root,'build-info.json'),'utf8'));
          if(m.sourceCommit!==process.env.GITHUB_SHA||m.sourceClean!==true||m.syntheticOnly!==true) throw new Error('Preview source/clean/synthetic gate failed');
          if(Object.keys(m.assets).length!==19) throw new Error('Expected 19 preview assets');
          for(const [name,spec] of Object.entries(m.assets)){
            const file=path.resolve(root,name);
            if(!file.startsWith(path.resolve(root)+path.sep)) throw new Error('Unsafe asset path');
            const bytes=fs.readFileSync(file);
            if(bytes.length!==spec.bytes||crypto.createHash('sha256').update(bytes).digest('hex')!==spec.sha256) throw new Error('Asset hash mismatch: '+name);
            if(bytes.includes(Buffer.from('personal-workbench-v2-staging'))) throw new Error('Staging hostname found in preview asset: '+name);
          }
          if(!Object.keys(m.assets).some(name=>name.endsWith('/preview-privacy.js'))) throw Error('Missing preview-only privacy gate');
          if(!fs.readFileSync(path.join(root,'business.html'),'utf8').includes('preview-privacy-shield')) throw Error('Missing startup privacy shield');
          if(!fs.readFileSync(path.join(root,'p0.html'),'utf8').includes('preview-privacy-shield')) throw Error('Missing backup privacy shield');
          console.log('PREVIEW_ASSET_GATE_PASS');
          NODE
      - name: Deploy only the pre-created isolated Worker
        shell: bash
        run: npx --yes wrangler@4.149.0 deploy --config v2/wrangler.preview.jsonc
      - name: Install isolated post-deploy mobile browser simulators
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix /tmp/workbench-preview-deploy-smoke --no-save --no-package-lock playwright@1.56.1
          /tmp/workbench-preview-deploy-smoke/node_modules/.bin/playwright install --with-deps chromium webkit
      - name: Verify LIVE deployed revision and complete mobile flows
        shell: bash
        env:
          NODE_PATH: /tmp/workbench-preview-deploy-smoke/node_modules
          PREVIEW_EXPECTED_SHA: ${{ github.sha }}
          PREVIEW_REQUIRE_LOCAL_LABEL: "true"
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/dev/v2-preview-isolated-20261111"
          WB_BROWSER=chromium node v2/test-preview-remote.cjs
          WB_BROWSER=webkit node v2/test-preview-remote.cjs
          echo PREVIEW_LIVE_MOBILE_GATE_PASS

