name: V2 preview isolated cloud data regression
on:
  push:
    branches:
      - dev/v2-preview-isolated-20261111
    paths:
      - .github/workflows/v2-preview-cloud-regression.yml
      - v2/test-preview-cloud.cjs
permissions:
  contents: read
concurrency:
  group: personal-workbench-v2-preview-deploy
  cancel-in-progress: false
jobs:
  test-cloud-synthetic-only:
    if: >-
      github.ref == 'refs/heads/dev/v2-preview-isolated-20261111' &&
      vars.V2_PREVIEW_DEPLOY_ENABLED == 'true' &&
      vars.V2_PREVIEW_FREE_PLAN_CONFIRMED == 'true' &&
      vars.V2_PREVIEW_WORKER_READY == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PREVIEW_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PREVIEW_TEST_TOKEN_FILE: ${{ runner.temp }}/preview-test-token
      WRANGLER_SEND_METRICS: "false"
    steps:
      - name: Checkout independent preview branch
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify strictly isolated and initially unconfigured Worker
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "wangxueqing0427-oss/personal-workbench"
          test "$GITHUB_REF" = "refs/heads/dev/v2-preview-isolated-20261111"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          node -e "const c=require('./v2/wrangler.preview.jsonc');if(c.name!=='personal-workbench-v2-preview'||c.vars.TEST_ENVIRONMENT!=='synthetic-only'||c.vars.TEST_DATASET!=='mobile-preview-20261111'||c.durable_objects.bindings[0].script_name)process.exit(1)"
          npx --yes wrangler@4.149.0 secret list --name personal-workbench-v2-preview --config v2/wrangler.preview.jsonc --format json > "$RUNNER_TEMP/preview-prior-secrets.json"
          node -e "const fs=require('fs');const values=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/preview-prior-secrets.json','utf8'));if(!Array.isArray(values)||values.some(x=>x.name==='TEST_TOKEN'))throw Error('Preview TEST_TOKEN already exists; no credentials changed')"
      - name: Prepare a temporary synthetic-only secret
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          node -e "process.stdout.write(require('node:crypto').randomBytes(32).toString('hex'))" > "$PREVIEW_TEST_TOKEN_FILE"
          chmod 600 "$PREVIEW_TEST_TOKEN_FILE"
          test "$(wc -c < "$PREVIEW_TEST_TOKEN_FILE")" -eq 64
      - name: Attach one-run test secret to isolated Worker
        id: write_secret
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.149.0 secret put TEST_TOKEN --name personal-workbench-v2-preview --config v2/wrangler.preview.jsonc < "$PREVIEW_TEST_TOKEN_FILE"
      - name: Test real isolated Cloudflare sync with random synthetic namespace
        shell: bash
        run: |
          set -euo pipefail
          node v2/test-preview-cloud.cjs
      - name: Revoke temporary test secret and block preview sync after test
        if: ${{ always() && steps.write_secret.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          printf 'y\n' | npx --yes wrangler@4.149.0 secret delete TEST_TOKEN --name personal-workbench-v2-preview --config v2/wrangler.preview.jsonc
          npx --yes wrangler@4.149.0 secret list --name personal-workbench-v2-preview --config v2/wrangler.preview.jsonc --format json > "$RUNNER_TEMP/preview-after-secrets.json"
          node -e "const fs=require('fs');const values=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/preview-after-secrets.json','utf8'));if(!Array.isArray(values)||values.some(x=>x.name==='TEST_TOKEN'))throw Error('Temporary credential revocation not confirmed')"
          echo PREVIEW_TEST_SECRET_REVOKED
      - name: Remove temporary token from CI runner
        if: ${{ always() }}
        shell: bash
        run: |
          rm -f "$PREVIEW_TEST_TOKEN_FILE"
