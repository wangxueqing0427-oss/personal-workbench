name: Release reviewed V2 iPhone capture and voice candidate only
on:
  push:
    branches:
      - review/v2-iphone-capture-release-20261117
    paths:
      - v2/iphone-capture-candidate-preview.trigger
permissions:
  contents: read
  actions: read
concurrency:
  group: isolated-v2-iphone-capture-test-worker
  cancel-in-progress: false
jobs:
  deploy:
    if: >-
      github.ref == 'refs/heads/review/v2-iphone-capture-release-20261117' &&
      vars.V2_ENCRYPTED_CANDIDATE_SCOPE_CONFIRMED == 'true' &&
      vars.V2_ENCRYPTED_CANDIDATE_FREE_PLAN_CONFIRMED == 'true' &&
      vars.V2_PREVIEW_DEPLOY_ENABLED == 'true' &&
      vars.V2_PREVIEW_FREE_PLAN_CONFIRMED == 'true' &&
      vars.V2_PREVIEW_WORKER_READY == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_ENCRYPTED_CANDIDATE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: "false"
      NODE_PATH: /tmp/v2-iphone-remote/node_modules
      BASE_URL: https://personal-workbench-v2-encrypted-candidate.wangxueqing0427.workers.dev/
      ORIGINAL_SOURCE_SHA: fec878d64a34552e28c1f43b4028766035a69667
      EXPECTED_RELEASE_ID: PENDING_RELEASE_ID
      PREVIOUS_RELEASE_ID: 7120ea2cc606c230bba6e8151c881d9d66873a97727707d48a1d4032c75d4a59
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Scope and existing-worker preflight without modifying environment
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "wangxueqing0427-oss/personal-workbench"
          test "$GITHUB_REF" = "refs/heads/review/v2-iphone-capture-release-20261117"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          node <<'NODE'
          const fs=require('fs');
          const c=JSON.parse(fs.readFileSync('v2/wrangler.encrypted-preview.jsonc','utf8'));
          const only=(o,keys)=>o&&Object.keys(o).every(x=>keys.includes(x));
          if(!only(c,['name','compatibility_date','workers_dev','assets','observability'])||
             !only(c.assets,['directory','html_handling','not_found_handling'])||
             !only(c.observability,['enabled'])||c.observability.enabled!==false||
             c.name!=='personal-workbench-v2-encrypted-candidate'||
             c.main!==undefined||c.workers_dev!==true||
             c.assets.directory!=='./candidate-public'||c.assets.binding!==undefined||
             c.assets.html_handling!=='none'||c.assets.not_found_handling!=='404-page'||
             c.routes!==undefined||c.route!==undefined||c.vars!==undefined||
             c.d1_databases!==undefined||c.kv_namespaces!==undefined||
             c.r2_buckets!==undefined||c.durable_objects!==undefined||
             c.triggers!==undefined)
             throw Error('Only static assets of existing dedicated candidate Worker may deploy');
          console.log('ISOLATED_PASSWORDLESS_CONFIG_PASS');
          NODE
          node <<'NODE'
          (async()=>{
            const base='https://api.cloudflare.com/client/v4/accounts/'+process.env.CLOUDFLARE_ACCOUNT_ID+
              '/workers/scripts/personal-workbench-v2-encrypted-candidate';
            const headers={Authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN};
            async function get(path){
              const response=await fetch(base+path,{headers});
              const body=await response.json().catch(()=>({}));
              if(!response.ok||body.success===false)throw Error('Target-scoped access denied or Worker missing: '+path+' status='+response.status);
              return body.result||{};
            }
            const settings=await get('/settings');
            if(!Object.prototype.hasOwnProperty.call(settings,'bindings')||
               !Array.isArray(settings.bindings)||settings.bindings.length!==0)
              throw Error('Target Worker bindings must explicitly be empty; refusing update');
            const sub=await get('/subdomain');
            if(sub.enabled!==true)throw Error('Target Worker workers.dev route missing');
            console.log('DEDICATED_TARGET_EMPTY_BINDINGS_PASS');
          })().catch(error=>{console.error(error.message);process.exitCode=1;});
          NODE
      - name: Refuse changed target or wrong previous tested build
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          (async()=>{
            const base=process.env.BASE_URL;
            const r=await fetch(base+'build-info.json',{cache:'no-store',redirect:'error',signal:AbortSignal.timeout(12000)});
            if(r.status!==200)throw Error('Candidate target no longer returns expected build manifest');
            const old=await r.json();
            if(old.releaseId!==process.env.PREVIOUS_RELEASE_ID||
               old.sourceCommit!=='4c8062eefc1a617a63622d556ee91ca89cb72a27'||
               old.syntheticOnly!==true||old.cloudConnected!==false||
               old.productionReady!==false||old.productionDeployAllowed!==false)
               throw Error('Candidate target diverged; do not overwrite');
            console.log('ORIGINAL_SYNTHETIC_RELEASE_GUARD_PASS');
          })().catch(error=>{console.error(error.message);process.exitCode=1;});
          NODE
      - name: Verify original green Linux Chromium and WebKit build
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          (async()=>{
            const url='https://api.github.com/repos/wangxueqing0427-oss/personal-workbench/actions/runs/44059878520';
            const r=await fetch(url,{headers:{Authorization:'Bearer '+process.env.GH_TOKEN,Accept:'application/vnd.github+json'}});
            if(!r.ok)throw Error('Cannot verify passwordless build CI');
            const ci=await r.json();
            if(ci.status!=='completed'||ci.conclusion!=='success'||
               ci.head_branch!=='fix/v2-iphone-voice-camera-ui-20261117'||
               ci.head_sha!==process.env.ORIGINAL_SOURCE_SHA||
               ci.path!=='.github/workflows/v2-iphone-capture-voice-ci.yml')
              throw Error('Passwordless tested source/CI mismatch');
            console.log('IPHONE_CAPTURE_VOICE_CI_UPSTREAM_SUCCESS');
          })().catch(error=>{console.error(error.message);process.exitCode=1;});
          NODE
      - name: Rebuild exact tested artifact from frozen source
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$ORIGINAL_SOURCE_SHA"
          git diff --name-only "$ORIGINAL_SOURCE_SHA" "$GITHUB_SHA" |
            while IFS= read -r changed; do
              case "$changed" in
                .github/workflows/v2-iphone-capture-reviewed-release.yml|v2/iphone-capture-candidate-preview.trigger)
                  echo "Allowed release-only change: $changed" ;;
                *) echo "STOP: tested app or unknown input changed: $changed" >&2; exit 1 ;;
              esac
            done
          git worktree add --detach /tmp/v2-passwordless-frozen "$ORIGINAL_SOURCE_SHA"
          (
            cd /tmp/v2-passwordless-frozen
            node --check v2/build-encrypted-candidate.cjs
            node v2/build-encrypted-candidate.cjs
          )
          node <<'NODE'
          (async()=>{
            const fs=require('fs/promises');
            const p='/tmp/v2-passwordless-frozen/v2/candidate-public/';
            const m=JSON.parse(await fs.readFile(p+'build-info.json','utf8'));
            if(m.sourceCommit!==process.env.ORIGINAL_SOURCE_SHA||
               m.releaseId!==process.env.EXPECTED_RELEASE_ID||
               m.syntheticOnly!==true||m.cloudConnected!==false||
               m.productionReady!==false||m.productionDeployAllowed!==false||
               m.isolatedTestDeployAllowed!==true||m.freshEmpty!==true||
               Object.keys(m.files).length!==12)throw Error('Frozen candidate manifest mismatch');
            const h=await fs.readFile(p+'business.html','utf8');
            const boot=await fs.readFile(p+'encrypted-boot.js','utf8');
            if(!boot.includes('data-passwordless-create')||
               boot.includes('设置独立恢复密码')||
               !h.includes('business.css'))
               throw Error('Wrong iPhone login UX in candidate');
            for(const [name,spec] of Object.entries(m.files)){
              const bytes=await fs.readFile(p+name);
              const hash=require('crypto').createHash('sha256').update(bytes).digest('hex');
              if(bytes.length!==spec.bytes||hash!==spec.sha256)
                throw Error('Frozen candidate asset hash mismatch: '+name);
            }
            console.log('IPHONE_CAPTURE_FROZEN_ARTIFACT_REPRODUCED_PASS');
          })().catch(error=>{console.error(error.message);process.exitCode=1;});
          NODE
      - name: Prepare only new remote HTTPS smoke test
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix /tmp/v2-iphone-remote --no-save --no-package-lock playwright@1.56.1
          /tmp/v2-iphone-remote/node_modules/.bin/playwright install --with-deps chromium webkit
      - name: Deploy only the dedicated synthetic test Worker
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/v2-passwordless-frozen
          npx --yes wrangler@4.149.0 deploy --config v2/wrangler.encrypted-preview.jsonc
      - name: Verify live HTTPS asset hashes and passwordless boot in both engines
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs/promises'),crypto=require('crypto'),{chromium,webkit}=require('playwright');
          const base=process.env.BASE_URL,p='/tmp/v2-passwordless-frozen/v2/candidate-public/';
          const check=(cond,what)=>{if(!cond)throw Error('Remote acceptance failed: '+what);console.log('PASS '+what);};
          (async()=>{
            const expected=JSON.parse(await fs.readFile(p+'build-info.json','utf8'));
            const response=await fetch(base+'build-info.json',{redirect:'error'});
            check(response.ok,'remote manifest status');
            const actual=await response.json();
            check(actual.sourceCommit===process.env.ORIGINAL_SOURCE_SHA&&
              actual.releaseId===process.env.EXPECTED_RELEASE_ID&&
              actual.syntheticOnly===true&&actual.productionReady===false,
              'remote verified passwordless release');
            for(const [name,spec]of Object.entries(expected.files)){
              const response=await fetch(base+name,{redirect:'error'});
              check(response.ok,'asset '+name+' HTTP');
              const bytes=Buffer.from(await response.arrayBuffer());
              check(bytes.length===spec.bytes&&crypto.createHash('sha256').update(bytes).digest('hex')===spec.sha256,
                'asset '+name+' SHA256');
            }
            for(const [name,engine]of [['chromium',chromium],['webkit',webkit]]){
              const browser=await engine.launch({headless:true});
              try{
                const ctx=await browser.newContext({viewport:{width:390,height:844},isMobile:true,hasTouch:true,locale:'zh-CN'});
                const page=await ctx.newPage(),errors=[];
                page.on('pageerror',e=>errors.push(e.message));
                await page.goto(base+'business.html',{waitUntil:'load'});
                await page.getByRole('heading',{name:'欢迎使用个人工作台'}).waitFor();
                check(await page.locator('input[type=password]').count()===0,name+' no password prompt');
                await page.locator('[data-passwordless-create]').click();
                await page.locator('[data-first-use]').waitFor();
                await page.reload({waitUntil:'load'});
                await page.locator('nav button[data-route="more"]').waitFor();
                check(await page.locator('input[type=password]').count()===0,name+' direct reopen');
                check(errors.length===0,name+' no JS exceptions');
                await page.locator('nav button[data-route="note"]').click();
                check(await page.locator('.voice-panel button[data-voice-keyboard]').isVisible(),name+' native dictation primary action');
                await page.locator('.voice-panel button[data-voice-keyboard]').click();
                check(await page.evaluate(()=>document.activeElement?.matches('form[data-form="note"] textarea[name="text"]')),name+' native dictation focus');
                await page.locator('nav button[data-route="more"]').click();
                await page.locator('button[data-route="files"]').click();
                const photo=page.locator('form[data-form="file"] input[name="photo"]');
                const png=Buffer.from('iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAwMCAO+/pZcAAAAASUVORK5CYII=','base64');
                await photo.setInputFiles({name:'remote-iphone-synthetic.png',mimeType:'image/png',buffer:png});
                await page.locator('[data-camera-result]:not([hidden])').waitFor();
                await page.locator('[data-camera-preview] img').waitFor();
                check(!await page.locator('[data-file-submit]').isDisabled(),name+' camera preview and save action');
                await page.locator('[data-file-submit]').click();
                await page.waitForFunction(async()=>{const s=await WorkbenchBusinessStore.read();return s.files.length===1;});
                const saved=await page.evaluate(async()=>{
                  const s=await WorkbenchBusinessStore.read();
                  const f=await WorkbenchBusinessStore.readFile(s.files[0].id);
                  return {count:s.files.length,name:f.name,size:f.size,type:f.type};
                });
                check(saved.count===1&&saved.name==='remote-iphone-synthetic.png'&&saved.size===png.length,name+' encrypted camera file readback');
                await ctx.close();
              }finally{await browser.close();}
            }
            console.log('IPHONE_CAPTURE_LIVE_HTTPS_CHROMIUM_WEBKIT_PASS');
          })().catch(e=>{console.error(e.stack||e.message);process.exitCode=1;});
          NODE
