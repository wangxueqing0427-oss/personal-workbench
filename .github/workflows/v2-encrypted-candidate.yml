name: V2 encrypted offline release candidate - build only
on:
  push:
    branches:
      - dev/v2-preview-isolated-20261111
    paths:
      - .github/workflows/v2-encrypted-candidate.yml
      - v2/build-encrypted-candidate.cjs
      - v2/test-encrypted-candidate.cjs
      - v2/test-encrypted-candidate-sw.cjs
      - v2/privacy-delta-journal-poc.js
      - v2/fresh-encrypted-boot-lab.js
      - v2/business-core.js
      - v2/business-ui.js
      - v2/business.css
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-test-encrypted-candidate:
    if: github.ref == 'refs/heads/dev/v2-preview-isolated-20261111'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    env:
      NODE_PATH: /tmp/workbench-v2-encrypted-candidate/node_modules
      WB_BROWSER: ${{ matrix.browser }}
    steps:
      - name: Read only checkout of isolated feature branch
        uses: actions/checkout@v4
      - name: Enforce no deployment access and immutable source build
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "wangxueqing0427-oss/personal-workbench"
          test "$GITHUB_REF" = "refs/heads/dev/v2-preview-isolated-20261111"
          node --check v2/build-encrypted-candidate.cjs
          node --check v2/test-encrypted-candidate.cjs
          node --check v2/test-encrypted-candidate-sw.cjs
          ! grep -Ei 'wrangler deploy|CLOUDFLARE_API_TOKEN|PRODUCTION_API_TOKEN' v2/build-encrypted-candidate.cjs v2/test-encrypted-candidate.cjs
          node v2/build-encrypted-candidate.cjs | tee /tmp/encrypted-candidate-build.log
          grep -F 'ENCRYPTED_CANDIDATE_BUILD_PASS' /tmp/encrypted-candidate-build.log
          grep -F '"deployAllowed":false' /tmp/encrypted-candidate-build.log
      - name: Verify offline asset SHA256 install rollback without browser or network
        shell: bash
        run: |
          set -euo pipefail
          node v2/test-encrypted-candidate-sw.cjs | tee /tmp/encrypted-candidate-sw.log
          grep -F 'CANDIDATE_OFFLINE_INTEGRITY_GATE_PASS' /tmp/encrypted-candidate-sw.log
          grep -F '"oldReleaseKeptOnFailure":true' /tmp/encrypted-candidate-sw.log
      - name: Install isolated browser with fixed Playwright version
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix /tmp/workbench-v2-encrypted-candidate --no-save --no-package-lock playwright@1.56.1
          /tmp/workbench-v2-encrypted-candidate/node_modules/.bin/playwright install --with-deps "$WB_BROWSER"
      - name: Test real static candidate bundle on offline iPhone-sized browsers
        shell: bash
        run: |
          set -euo pipefail
          node v2/test-encrypted-candidate.cjs | tee /tmp/encrypted-candidate-browser.log
          grep -F 'ENCRYPTED_CANDIDATE_BROWSER_PASS' /tmp/encrypted-candidate-browser.log
          grep -F '"productionReady":false' /tmp/encrypted-candidate-browser.log
          echo 'ENCRYPTED_CANDIDATE_VERIFIED_BUT_PRODUCTION_NOT_AUTHORIZED'
