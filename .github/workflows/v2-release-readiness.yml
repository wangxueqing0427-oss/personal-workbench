name: V2 fresh-start release gate - isolated, no V1 migration
on:
  push:
    branches:
      - dev/v2-preview-isolated-20261111
    paths:
      - .github/workflows/v2-release-readiness.yml
      - v2/fresh-start-readiness.cjs
      - v2/test-fresh-start-readiness.cjs
      - v2/business-ui.js
      - v2/business-core.js
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fresh-start-gate:
    if: github.ref == 'refs/heads/dev/v2-preview-isolated-20261111'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout isolated dev branch
        uses: actions/checkout@v4
      - name: Verify source and explicit fresh-start release blockers
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "wangxueqing0427-oss/personal-workbench"
          test "$GITHUB_REF" = "refs/heads/dev/v2-preview-isolated-20261111"
          node --check v2/business-ui.js
          node --check v2/business-core.js
          node --check v2/fresh-start-readiness.cjs
          node --check v2/test-fresh-start-readiness.cjs
          node v2/test-fresh-start-readiness.cjs | tee /tmp/v2-fresh-release.txt
          grep -F 'FRESH_START_RELEASE_GATE_PASS' /tmp/v2-fresh-release.txt
          grep -F '"requiresLegacyMigration":false' /tmp/v2-fresh-release.txt
          grep -F '"productionReady":false' /tmp/v2-fresh-release.txt
          echo 'FRESH_START_GUARD_PASS__REAL_PRODUCTION_STILL_NOT_AUTHORIZED'
