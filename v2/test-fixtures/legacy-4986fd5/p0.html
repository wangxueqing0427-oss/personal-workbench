<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V2.0 P0 数据安全测试</title><style>body{font:16px system-ui,sans-serif;background:#f3f6fa;color:#16324b;margin:0;padding:20px}main{max-width:680px;margin:auto}section{background:white;padding:22px;border-radius:18px;margin:18px 0}h1{font-size:25px}p{line-height:1.6}button,input{box-sizing:border-box;width:100%;padding:14px;margin:8px 0;font:inherit;border-radius:10px;border:1px solid #bccbda}button{background:#1468c7;color:white;cursor:pointer}button:disabled{opacity:.5;cursor:default}output{display:block;white-space:pre-wrap;line-height:1.6;overflow-wrap:anywhere}.muted{color:#526b82}</style></head>
<body><main><h1>V2.0 · P0 数据安全测试</h1><p>开发验证页。恢复只进入新建的隔离数据库。当前工作台记录、原文件和同步身份保持原样。</p><section><h2>完整加密备份</h2><p>包含本机工作台记录、历史快照、同步身份、文件原件和全文。请保存备份密码，遗失后无法解密。本阶段限制为128MB编码内容，超限会停止，绝不省略文件。</p><label for="password">备份密码（至少12位）</label><input id="password" type="password" autocomplete="new-password"><button id="export">生成并下载完整备份</button><p class="muted">读取仅在点击后发生。不会发送到云端；下载完成后请保存到可靠的位置。</p></section><section><h2>校验与隔离恢复</h2><input id="file" type="file" accept=".json,application/json"><button id="validate">校验备份</button><button id="restore" disabled>恢复到全新隔离测试区</button><p class="muted">本阶段不提供覆盖现有数据的恢复操作。旧版普通JSON可继续保留，但不能通过完整原件备份验收。</p></section><section><output id="status" aria-live="polite">尚未读取任何数据。</output></section></main><script src="safety-core.js"></script><script src="p0-ui.js"></script></body></html>
