<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>个人工作台 V2.0 第二阶段 · 隔离预览</title><link rel="stylesheet" href="business.css"></head>
<body><header><div><small>医疗业务 · 独立开发预览</small><h1>个人工作台</h1></div><span class="badge">仅合成示例</span></header><p class="boundary">不读取V1.5.7真实数据，不连接生产云端。仅localhost启用开发离线缓存，此页不是正式版本。</p><p id="sync-status" class="boundary" aria-live="polite">等待同步 · 尚未配置隔离后端</p><main id="content"></main><output id="notice" role="status" aria-live="polite"></output><nav aria-label="主导航"><button data-route="home">今日</button><button data-route="hospitals">医院业务</button><button data-route="note">＋ 记录</button><button data-route="supplies">耗材</button><button data-route="more">更多</button></nav><script src="business-core.js"></script><script src="business-store.js"></script><script src="offline-sync.js"></script><script src="business-ui.js"></script><script>const offlineRunner=WorkbenchOfflineSync.create();async function showSyncStatus(){const info=await WorkbenchOfflineSync.status();document.getElementById('sync-status').textContent=info.status+' · '+info.pending+' 项'+(info.configured?'':' · 尚未配置隔离后端')}window.addEventListener('workbench-sync-status',showSyncStatus);offlineRunner.start();showSyncStatus();if(location.hostname==='127.0.0.1'&&'serviceWorker'in navigator)navigator.serviceWorker.register('offline-sw.js',{scope:'./'}).catch(()=>{});</script></body></html>
