<body><div id="app"></div><script src="app.js?v=0622"></script><script src="hotfix-0621.js?v=0622"></script><script>
// V0.6.2.2 iOS navigation hard fix: delegated bottom-nav taps.
document.addEventListener('click', function(e){
  const b=e.target.closest('.nav button');
  if(!b) return;
  const txt=(b.textContent||'').trim();
  const map={'首页':'home','AI助理':'assistant','执行':'tasks','未来雷达':'radar','客户/商机':'customers','设置':'settings'};
  if(map[txt]){e.preventDefault();e.stopPropagation();go(map[txt]);}
}, true);
</script></body>
</html>
